name: Build Photoframe Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      photoframe_branch:
        description: 'Photoframe repo branch to build from'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout pi-gen
        uses: actions/checkout@v4

      - name: Set up build config
        run: |
          BRANCH="${{ github.event.inputs.photoframe_branch || 'master' }}"
          cat > config.local <<EOF
          IMG_NAME='PHOTOFRAME'
          PHOTOFRAME_BRANCH=${BRANCH}
          RELEASE=$(date +%Y-%m-%d)
          TARGET_HOSTNAME=photoframe
          FIRST_USER_NAME=pi
          FIRST_USER_PASS=raspberry
          ENABLE_SSH=1
          LOCALE_DEFAULT=en_US.UTF-8
          KEYBOARD_KEYMAP=us
          KEYBOARD_LAYOUT="English (US)"
          TIMEZONE_DEFAULT=America/New_York
          EOF

      - name: Build image with Docker
        run: |
          ./build-docker.sh

      - name: Compress image
        run: |
          cd deploy
          IMAGE=$(ls *.img 2>/dev/null | head -1)
          if [ -n "$IMAGE" ]; then
            xz -9 -T0 "$IMAGE"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoframe-image
          path: deploy/*.img.xz
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/*.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
